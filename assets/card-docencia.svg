<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Professor na Anhanguera">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.13"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="clip"><rect width="900" height="200" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="200" fill="#0b1020"/>
    <rect width="900" height="200" fill="url(#grid)"/>
    <rect x="-140" y="0" width="140" height="200" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1040 0" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="198.5" rx="17.5" fill="none" stroke="url(#ac)" stroke-width="1.5" stroke-opacity="0.85"/>

  <g transform="translate(95 100)">
    <circle r="62" fill="none" stroke="url(#ac)" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="46" fill="#34d399" fill-opacity="0.07" stroke="url(#ac)" stroke-opacity="0.5"/>
    <text y="14" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="40" font-weight="700" fill="#6ee7b7">03</text>
  </g>

  <text x="190" y="52" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" letter-spacing="4" fill="#6ee7b7">DOCÊNCIA</text>
  <text x="190" y="94" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="36" font-weight="800" fill="#f8fafc">Anhanguera</text>
  <text x="190" y="124" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#5eead4">Professor universitário</text>
  <text x="190" y="154" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#94a3b8">Nas horas vagas, levo a prática do mercado para a sala de aula</text>
  <text x="190" y="178" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#94a3b8">e ajudo a formar novos profissionais de tecnologia.</text>

  <g transform="translate(690 28)">
    <rect width="180" height="40" rx="20" fill="none" stroke="url(#ac)" stroke-width="1.5"/>
    <text x="90" y="25.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="14" fill="#e2e8f0">anhanguera.com.br ↗</text>
  </g>
</svg>
