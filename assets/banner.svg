<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Tecnologia que automatiza o que importa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset="0.6" stop-color="#0c1225"/>
      <stop offset="1" stop-color="#160c30"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity="0.08"/>
    </pattern>
    <radialGradient id="g1" cx="0.1" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.85" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#g1)"/>
    <rect width="1200" height="320" fill="url(#g2)"/>

    <!-- circuitos animados -->
    <g fill="none" stroke="url(#neon)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 12" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2s" repeatCount="indefinite"/>
      <path d="M640 60 H760 L800 100 H905"/>
      <path d="M600 262 H730 L770 222 H880 L905 200"/>
      <path d="M690 160 H820 L850 160 H905"/>
      <path d="M1095 160 H1200"/>
      <path d="M1080 92 L1120 52 H1200"/>
      <path d="M1080 228 L1120 268 H1200"/>
    </g>
    <g fill="#22d3ee">
      <circle cx="640" cy="60" r="4"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="262" r="4" fill="#8b5cf6"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="160" r="4" fill="#f472b6"><animate attributeName="opacity" values="1;0.25;1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1196" cy="160" r="4"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1196" cy="52" r="4" fill="#8b5cf6"><animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="1196" cy="268" r="4" fill="#f472b6"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- núcleo -->
    <g transform="translate(1000 160)">
      <circle r="96" fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 10" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      </circle>
      <circle r="68" fill="none" stroke="#8b5cf6" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="22 14" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
      </circle>
      <rect x="-30" y="-30" width="60" height="60" rx="10" fill="none" stroke="#f472b6" stroke-width="2" transform="rotate(45)">
        <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="16s" repeatCount="indefinite"/>
      </rect>
      <circle r="9" fill="#22d3ee">
        <animate attributeName="r" values="7;12;7" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- texto -->
    <text x="70" y="88" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" letter-spacing="3" fill="#22d3ee">// olá, mundo</text>
    <text x="70" y="160" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="800" fill="#f8fafc">Tecnologia que</text>
    <text x="70" y="222" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="800" fill="url(#neon)">automatiza o que importa.</text>
    <text x="70" y="272" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="18" fill="#94a3b8" textLength="670" lengthAdjust="spacing">&gt; sistemas corporativos · automação · inteligência artificial</text>
    <rect x="748" y="256" width="11" height="22" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- barra inferior -->
    <rect x="0" y="314" width="1200" height="6" fill="url(#neon)"/>
    <rect x="-260" y="314" width="260" height="6" fill="url(#hot)">
      <animate attributeName="x" from="-260" to="1200" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
