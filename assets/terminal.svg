      <text x="32" y="162" opacity="0"><tspan fill="#22d3ee">$</tspan><tspan fill="#e2e8f0"> cat foco.txt</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.214;0.224;0.93;0.97;1" dur="14s" repeatCount="indefinite"/></text>
      <text x="32" y="192" opacity="0"><tspan fill="#a78bfa">→</tspan><tspan fill="#cbd5e1"> automação empresarial</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.31;0.93;0.97;1" dur="14s" repeatCount="indefinite"/></text>
      <text x="32" y="222" opacity="0"><tspan fill="#a78bfa">→</tspan><tspan fill="#cbd5e1"> inteligência artificial</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.386;0.396;0.93;0.97;1" dur="14s" repeatCount="indefinite"/></text>
      <text x="32" y="252" opacity="0"><tspan fill="#a78bfa">→</tspan><tspan fill="#cbd5e1"> sistemas de alto impacto</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.471;0.481;0.93;0.97;1" dur="14s" repeatCount="indefinite"/></text>

      <text x="32" y="292" opacity="0"><tspan fill="#22d3ee">$</tspan><tspan fill="#e2e8f0"> uptime</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.557;0.567;0.93;0.97;1" dur="14s" repeatCount="indefinite"/></text>
      <text x="32" y="322" opacity="0"><tspan fill="#a78bfa">→</tspan><tspan fill="#34d399"> 16+ anos construindo software crítico</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.643;0.653;0.93;0.97;1" dur="14s" repeatCount="indefinite"/></text>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.729;0.739;0.93;0.97;1" dur="14s" repeatCount="indefinite"/>
        <text x="32" y="352" fill="#22d3ee">$</text>
