<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Formação: bacharelado em Sistemas de Informação e duas pós-graduações">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="clip"><rect width="900" height="250" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="250" fill="#0b1020"/>
    <rect width="900" height="250" fill="url(#grid)"/>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="248.5" rx="17.5" fill="none" stroke="url(#neon)" stroke-width="1.5" stroke-opacity="0.7"/>

  <path d="M160 70 H740" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 10" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="4s" repeatCount="indefinite"/>
  </path>

  <g>
    <circle cx="160" cy="70" r="22" fill="none" stroke="#22d3ee" stroke-opacity="0.4">
      <animate attributeName="r" values="16;28;16" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="70" r="12" fill="#0b1020" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="450" cy="70" r="22" fill="none" stroke="#8b5cf6" stroke-opacity="0.4">
      <animate attributeName="r" values="16;28;16" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="70" r="12" fill="#0b1020" stroke="#8b5cf6" stroke-width="3"/>
    <circle cx="740" cy="70" r="22" fill="none" stroke="#f472b6" stroke-opacity="0.4">
      <animate attributeName="r" values="16;28;16" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="70" r="12" fill="#0b1020" stroke="#f472b6" stroke-width="3"/>
  </g>

  <g text-anchor="middle">
    <text x="160" y="128" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12" letter-spacing="3" fill="#22d3ee">GRADUAÇÃO</text>
    <text x="160" y="157" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Bacharelado em</text>
    <text x="160" y="179" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Sistemas de Informação</text>
    <text x="160" y="212" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">Unisal</text>

    <text x="450" y="128" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12" letter-spacing="3" fill="#a78bfa">PÓS-GRADUAÇÃO</text>
    <text x="450" y="157" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Inteligência Artificial</text>
    <text x="450" y="179" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">e Machine Learning</text>
    <text x="450" y="212" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">Unopar Anhanguera</text>

    <text x="740" y="128" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12" letter-spacing="3" fill="#f472b6">PÓS-GRADUAÇÃO</text>
    <text x="740" y="157" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Liderança e Gestão de Equipes</text>
    <text x="740" y="179" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">de Alta Performance</text>
    <text x="740" y="212" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">Unopar Anhanguera</text>
  </g>
</svg>
